name: Remote SSH Command and CI Workflow

on:
    push:
        branches:
            - main # или ваша основная ветка
            - dev
    pull_request:
        branches:
            - main

jobs:
    build:
        name: Build and Deploy
        runs-on: ubuntu-latest
        steps:
            - name: Executing remote SSH commands using password
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.HOST }}
                  username: ${{ secrets.USERNAME }}
                  password: ${{ secrets.PASSWORD }}
                  port: ${{ secrets.PORT }}
                  script: whoami

            - name: Deploy to server using SSH with password
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.HOST }}
                  username: ${{ secrets.USERNAME }}
                  password: ${{ secrets.PASSWORD }}
                  port: ${{ secrets.PORT }}
                  script: |
                      cd /home/ubuntu/

                      echo "🔄 Cтягиваем код с github"
                      git clone git@github.com:VladyslavDobrovolskyi/weekly-streaming.git

                      echo "🔄 Переключение на ветку dev и обновление репозитория"
                      cd weekly-streaming
                      git checkout dev
                      git pull

                      echo "🛑 Остановка и удаление контейнеров"
                      docker rm -f $(docker ps -aq) || true
                      docker-compose down --volumes
                      docker network prune -f

                      echo "🛠 Пересборка контейнеров без кэша"
                      docker-compose build --no-cache

                      echo "🚀 Запуск контейнеров"
                      docker-compose up -d --force-recreate

                      echo " 🗑️ Очистка пространства"
                      cd .. 
                      rm -rf weekly-streaming
                      echo "📝 Проверка запущенных контейнеров"
                      docker ps -a



                      echo "✅ Деплой завершен успешно!"
